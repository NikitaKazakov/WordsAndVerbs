<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Слова" />
    <meta name="description" content="Квиз слов, глаголов, фразовых и оборотов." />
    <title>Слова и глаголы</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="stat">
          <span class="stat-label">серия</span>
          <span id="streak" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">рекорд</span>
          <span id="best" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">сегодня</span>
          <span id="today" class="stat-value">0</span>
        </div>
      </header>

      <nav class="modes sections" id="sections" aria-label="Раздел">
        <button type="button" class="mode" data-section="words">Слова</button>
        <button type="button" class="mode" data-section="verbs">Глаголы</button>
        <button type="button" class="mode" data-section="phrasal">Фразовые</button>
        <button type="button" class="mode" data-section="phrases">Обороты</button>
      </nav>

      <nav class="modes" id="verb-modes" aria-label="Глаголы" hidden>
        <button type="button" class="mode" data-verb-mode="simple">Простые</button>
        <button type="button" class="mode" data-verb-mode="prefixed">Приставки</button>
        <button type="button" class="mode" data-verb-mode="mixed">Смесь</button>
      </nav>

      <main class="stage">
        <p class="hint" id="hint">выбери перевод</p>
        <h1 class="prompt" id="prompt">Загрузка…</h1>
        <p class="forms" id="forms" hidden></p>
      </main>

      <section class="grid" id="grid" aria-label="Варианты"></section>

      <div class="actions">
        <button type="button" class="ghost" id="dont-know">Не знаю</button>
        <button type="button" class="next" id="next" hidden>Продолжить</button>
      </div>

      <section class="mastery" aria-label="Прогресс">
        <div class="bar" id="bar">
          <span class="seg new" id="seg-new"></span>
          <span class="seg learning" id="seg-learning"></span>
          <span class="seg known" id="seg-known"></span>
        </div>
        <p class="legend" id="legend">новые 0 · учу 0 · знаю 0</p>
      </section>

      <div class="foot">
        <button type="button" class="ghost add" id="add-open">Добавить</button>
        <button type="button" class="reset" id="reset">Сбросить прогресс</button>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <form class="sheet-card" id="add-form">
        <h2 id="sheet-title">Новое слово</h2>
        <label>
          По-русски
          <input id="add-ru" name="ru" autocomplete="off" required />
        </label>
        <label>
          По-английски
          <textarea id="add-en" name="en" rows="3" required></textarea>
        </label>
        <p class="sheet-error" id="sheet-error" hidden></p>
        <div class="sheet-actions">
          <button type="button" class="ghost" id="add-cancel">Отмена</button>
          <button type="submit" class="next">Сохранить</button>
        </div>
      </form>
    </div>

    <div class="flash" id="flash" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
